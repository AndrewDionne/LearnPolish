name: V2 checks

on:
  pull_request:
    paths:
      - 'v2/**'
      - '.github/workflows/v2-ci.yml'
      - '.github/workflows/deploy-v2-pages.yml'
      - 'dev.sh'
      - 'prod_like.sh'
      - 'publish.sh'
      - 'README.md'
      - 'Dockerfile.v2'
      - '.dockerignore'
      - 'render.yaml'
      - 'chat ai workflow.md'
      - 'docs/sets/**'
      - 'docs/static/**'
  push:
    branches: [main]
    paths:
      - 'v2/**'
      - '.github/workflows/v2-ci.yml'
      - '.github/workflows/deploy-v2-pages.yml'
      - 'dev.sh'
      - 'prod_like.sh'
      - 'publish.sh'
      - 'README.md'
      - 'Dockerfile.v2'
      - '.dockerignore'
      - 'render.yaml'
      - 'chat ai workflow.md'
      - 'docs/sets/**'
      - 'docs/static/**'

permissions:
  contents: read

jobs:
  frontend:
    # Ubuntu 24.04 runners already include stable Google Chrome. Avoid apt/browser
    # installation stalls while retaining full desktop/mobile browser coverage.
    runs-on: ubuntu-24.04
    env:
      PTP_CI_SYSTEM_CHROME: '1'
    timeout-minutes: 20
    defaults:
      run:
        working-directory: v2/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify migration, types, unit tests and production build
        run: npm run check
      - name: Verify preinstalled Chrome for synthetic desktop/mobile journeys
        run: google-chrome --version
      - name: Provide pinned FFmpeg for public Polish Ogg decoding
        run: |
          python3 -m pip install --disable-pip-version-check "imageio-ffmpeg==0.6.0"
          mkdir -p "$RUNNER_TEMP/ptp-tools"
          python3 - <<'PY'
          import os
          from pathlib import Path
          from imageio_ffmpeg import get_ffmpeg_exe
          target=Path(os.environ["RUNNER_TEMP"])/"ptp-tools"/"ffmpeg"
          target.symlink_to(get_ffmpeg_exe())
          print("FFmpeg executable verified:",get_ffmpeg_exe())
          PY
          echo "$RUNNER_TEMP/ptp-tools" >> "$GITHUB_PATH"
      - name: Prepare public-domain natural Polish test WAVs (no AI)
        run: python3 ../benchmarks/public_polish_audio.py --output-dir "$RUNNER_TEMP/ptp-public-polish"
      - name: Validate identical-input six-call research preview (no AI)
        run: python3 ../benchmarks/public_three_model_pilot.py --fixture-dir "$RUNNER_TEMP/ptp-public-polish"
      - name: Browser journeys (desktop and mobile, including natural public Polish audio)
        env:
          PTP_PUBLIC_POLISH_WAV_DIR: ${{ runner.temp }}/ptp-public-polish
        run: npm run test:e2e
      - name: Upload browser screenshots on completion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-browser-evidence
          path: |
            v2/frontend/test-results/**/*.png
            v2/frontend/test-results/**/*.zip
          if-no-files-found: ignore
          retention-days: 7

  private-family-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated family API dependencies
        run: python -m pip install "Flask==3.1.1" "psycopg[binary]>=3.2,<4"
      - name: Test family membership, access control, XP integrity and invite behavior
        run: python -m unittest discover -s v2/server -p 'test_*.py' -v

  family-connected-browser:
    runs-on: ubuntu-24.04
    env:
      PTP_CI_SYSTEM_CHROME: '1'
    timeout-minutes: 15
    defaults:
      run:
        working-directory: v2/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install family service and frontend dependencies
        run: |
          python -m pip install "Flask==3.1.1" "psycopg[binary]>=3.2,<4"
          npm install --no-audit --no-fund
          npm run content
      - name: Verify preinstalled Chrome for connected synthetic journeys
        run: google-chrome --version
      - name: Launch isolated local family API
        run: |
          install -d -m 0700 "$RUNNER_TEMP/ptp-family"
          PTP_FAMILY_DB="$RUNNER_TEMP/ptp-family/test.sqlite" \
          PTP_FAMILY_CATALOG="$GITHUB_WORKSPACE/v2/frontend/public/generated/lessons.json" \
          PTP_FAMILY_ORIGINS=http://127.0.0.1:4173 \
          PTP_CI_VERIFICATION_OUTBOX="$RUNNER_TEMP/ptp-family/verification.jsonl" \
            nohup python "$GITHUB_WORKSPACE/v2/server/ci_family_server.py" > "$RUNNER_TEMP/ptp-family/server.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8016/api/v2/family/health; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/ptp-family/server.log"
          exit 1
      - name: Connected family signup/invite/XP browser journeys
        env:
          VITE_FAMILY_API_URL: http://127.0.0.1:8016
          VITE_SPEECH_ASSESSMENT_ENABLED: 'true'
          PTP_CI_VERIFICATION_OUTBOX: ${{ runner.temp }}/ptp-family/verification.jsonl
        run: npx playwright test e2e/family-connected.spec.ts e2e/speech-assessment-connected.spec.ts
      - name: Connected experimental blended Speak browser journey (synthetic only)
        env:
          VITE_FAMILY_API_URL: http://127.0.0.1:8016
          VITE_SPEECH_ASSESSMENT_ENABLED: 'true'
          VITE_SPEECH_BLEND_ENABLED: 'true'
        run: npx playwright test e2e/speech-blend-connected.spec.ts
      - name: Upload connected evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-connected-family-evidence
          path: |
            v2/frontend/test-results/**/*.png
            v2/frontend/test-results/**/*.zip
          if-no-files-found: ignore
          retention-days: 7

  benchmark-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test offline-only benchmark safeguards
        run: python -m unittest discover -s v2/benchmarks -p 'test_*.py' -v
