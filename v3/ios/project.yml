name: PathToPolish
options:
  bundleIdPrefix: com.pathtopolish
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  PathToPolish:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/generated
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pathtopolish.learning
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Record your pronunciation for private practice."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets:
        - PathToPolishTests
  PathToPolishTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: PathToPolish
