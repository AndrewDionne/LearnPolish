# FREE-ONLY Path to Polish V2 Blueprint. No persistent disk or paid resources.
# Deploys the offline-first learner UI, NOT family accounts/sync.
services:
  - type: web
    name: path-to-polish-v2
    runtime: docker
    region: frankfurt
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile.v2
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: PTP_RENDER_FAMILY_MODE
        value: disabled
      - key: PTP_SPEECH_ENABLED
        value: "0"
